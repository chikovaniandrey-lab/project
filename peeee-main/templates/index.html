<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Айсвилл</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-md custom-hotbar border-bottom py-3">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold text-white" href="/">Айсвилл</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                        aria-controls="navbarMenu" aria-expanded="false" aria-label="Открыть меню">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarMenu">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="/catalog">Каталог</a></li>
                    </ul>
                    <form class="d-flex gap-2" role="search">
                        <input class="form-control" type="search" placeholder="Поиск" aria-label="Поиск">
                        <button class="btn btn-outline-light" type="submit">Найти</button>
                    </form>
                    <a href="/cart" class="btn btn-outline-light ms-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
                        </svg>
                        <span>Корзина</span>
                        <span class="badge rounded-pill bg-white text-success ms-1">67</span>
                    </a>
                    <a href="/login" class="btn btn-outline-light ms-2">
                        <span>Войти</span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <div class="container-fluid flex-grow-1">
        <div class="row g-4 mt-2">
            <aside class="col-12 col-lg-3 col-xl-2 order-lg-2">
                <div class="card custom-notification sticky-top" style="top: 5.5rem;">
                    <div class="card-header">
                        <span class="badge bg-success">Бонус</span>
                    </div>
                    <div class="card-body">
                        <h5 class="fw-bold mb-2">Эксклюзивная скидка!</h5>
                        <p class="small mb-0">Используйте промокод «артемка» при оформлении первого заказа</p>
                    </div>
                </div>
            </aside>

            <main class="col-12 col-lg-9 col-xl-10 order-lg-1">
                <section class="carousel-container mx-auto">
                    <div id="carouselStacked" class="carousel slide" data-bs-ride="carousel">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="fw-bold mb-0 text-white">Интересное сегодня</h4>
                        </div>
                        <div class="carousel-inner rounded-5 shadow-sm">
                            <div class="carousel-item active">
                                <img src="/static/assets/карусель1.webp" class="d-block w-100" alt="Промо-слайд 1">
                            </div>
                            <div class="carousel-item">
                                <img src="/static/assets/карусель2.webp" class="d-block w-100" alt="Промо-слайд 2">
                            </div>
                            <div class="carousel-item">
                                <img src="/static/assets/карусель3.webp" class="d-block w-100" alt="Промо-слайд 3">
                            </div>
                            <div class="carousel-item">
                                <img src="/static/assets/syp.webp" class="d-block w-100" alt="Промо-слайд 4">
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselStacked" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon"></span>
                            <span class="visually-hidden">Назад</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselStacked" data-bs-slide="next">
                            <span class="carousel-control-next-icon"></span>
                            <span class="visually-hidden">Вперёд</span>
                        </button>
                    </div>
                </section>

                <section class="mx-auto mt-5" style="max-width: 1000px;">
                    <h4 class="fw-bold mb-4 text-white">Популярные товары</h4>
                    <div class="row row-cols-1 row-cols-md-3 g-4">
                        {% for i in data %}
                        <div class="col">
                            <div class="card h-100 product-card rounded-4 overflow-hidden shadow-sm">
                                <div class="product-img-wrapper">
                                    <img src="{{ i[5] }}" class="img-fluid object-fit-contain p-2" alt="{{ i[2] }}">
                                </div>
                                <div class="card-body p-3 d-flex flex-column justify-content-between">
                                    <div>
                                        <h5 class="card-title fw-semibold text-truncate mb-1">{{ i[2] }}</h5>
                                        <p class="text-body-secondary small mb-3">{{ i[3] }}</p>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center mt-auto">
                                        <span class="fw-bold">{{ i[4] }}</span>
                                        <button class="btn btn-sm btn-success rounded-pill px-3">В корзину</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
